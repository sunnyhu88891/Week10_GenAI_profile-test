<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>호지수 프로필</title>
  <meta name="description" content="언론홍보영상학과 대학원생 호지수의 프로필">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="identity">
    <div class="polaroid">
      <span class="sticker heart" aria-hidden="true">♥</span>
      <span class="sticker star" aria-hidden="true">✦</span>
      <img class="photo" src="photo.svg" alt="호지수 프로필 사진">
      <h1>호지수</h1>
      <p class="role">언론홍보영상학과 대학원생</p>
    </div>
  </header>

  <main>
    <section>
      <h2>소개</h2>
      <p class="bio">생성형 AI가 사람들의 말하기와 생각하기를 어떻게 바꾸는지 공부합니다. 기술 자체보다 그 기술을 쓰는 사람에게 일어나는 변화에 더 관심이 많습니다.</p>
    </section>

    <section>
      <h2>관심 분야</h2>
      <dl class="interests">
        <div>
          <dt><span aria-hidden="true">🫧</span> 생성형 AI와 커뮤니케이션</dt>
          <dd>AI와 나누는 대화가 사람 사이의 소통에 미치는 영향</dd>
        </div>
        <div>
          <dt><span aria-hidden="true">☁️</span> 인지 외주와 의존</dt>
          <dd>생각을 AI에 맡길 때 얻는 것과 잃는 것</dd>
        </div>
        <div>
          <dt><span aria-hidden="true">🎀</span> 미디어와 사회</dt>
          <dd>새로운 미디어가 일상과 여론을 바꾸는 과정</dd>
        </div>
      </dl>
    </section>

    <section>
      <h2>이메일</h2>
      <a class="email" href="mailto:s95280@yonsei.ac.kr">s95280@yonsei.ac.kr</a>
    </section>
  </main>

</html>
